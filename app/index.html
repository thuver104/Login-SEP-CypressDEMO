<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEP Demo - Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .login-container h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-container p.subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #6c63ff;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            color: #51cf66;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            display: none;
        }

        /* Dashboard page styles */
        .dashboard {
            display: none;
            text-align: center;
            color: #fff;
        }

        .dashboard h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .dashboard p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
        }

        .dashboard .welcome-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .dashboard .logout-btn {
            padding: 12px 32px;
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .dashboard .logout-btn:hover {
            background: rgba(255, 59, 48, 0.4);
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div class="login-container" id="loginForm">
        <h1>Welcome Back</h1>
        <p class="subtitle">SEP & QM – Cypress Demo Application</p>

        <form id="loginFormElement" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" data-testid="username-input">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" data-testid="password-input">
            </div>

            <button type="submit" class="login-btn" data-testid="login-button">Sign In</button>

            <p class="error-message" id="errorMessage" data-testid="error-message">Invalid username or password</p>
            <p class="success-message" id="successMessage" data-testid="success-message">Login successful! Redirecting...</p>
        </form>
    </div>

    <!-- Dashboard (shown after login) -->
    <div class="login-container dashboard" id="dashboard">
        <h1>Dashboard</h1>
        <p>You're logged in successfully</p>

        <div class="welcome-card">
            <p id="welcomeUser" data-testid="welcome-message">Welcome, User!</p>
            <p style="font-size: 13px; color: rgba(255,255,255,0.5);">SEP & QM Cypress Testing Demo</p>
        </div>

        <button class="logout-btn" id="logoutBtn" data-testid="logout-button" onclick="handleLogout()">Log Out</button>
    </div>

    <script>
        // Simulated valid credentials
        const VALID_USERS = [
            { username: 'testuser', password: 'password123' },
            { username: 'admin', password: 'admin@123' },
            { username: 'demouser', password: 'demo2024' }
        ];

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            const successMsg = document.getElementById('successMessage');

            // Reset messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Validate credentials
            const user = VALID_USERS.find(u => u.username === username && u.password === password);

            if (user) {
                successMsg.style.display = 'block';

                // Simulate redirect to dashboard after brief delay
                setTimeout(() => {
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('welcomeUser').textContent = `Welcome, ${username}!`;
                }, 1000);

                // Simulate API call to backend
                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                }).catch(() => {
                    // Silently handle - this is for demo purposes
                });
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function handleLogout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('successMessage').style.display = 'none';
        }
    </script>
</body>
</html>
